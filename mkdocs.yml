site_name: eResearch Support
site_url: https://rtis-docs.github.io/research-cluster/
repo_url: https://github.com/rtis-docs/research-cluster
repo_name: "Cluster Documentation"
theme : 
  name: material
  custom_dir: overrides
  logo: "assets/images/UoO_Logo_RGB_Horz_Gold-REV.svg"
  favicon: "assets/images/uoo-favicon-32x32.png"
  language: en
  font: 
    text: 'wickliffe-sans'
    code: 'Roboto Mono'
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
#    - navigation.expand # auto expands all sections
    - navigation.path
    - navigation.indexes
    - toc.follow

watch:
  - includes/

# Pages that are written but not ready to publish. Remove the entry to publish the page.
exclude_docs: |
  other_services/secure_research_environments.md
  # Superseded by announcements/ and long out of date. Kept in the repo rather than
  # deleted, so the history is still there if it is ever wanted.
  general/changelogs/
  # Fragments pulled into other pages with {% include %}. They are not pages in their
  # own right, so links inside them are written relative to the page that includes them.
  /child/

hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - awesome-nav
  - redirects:
      redirect_maps:
        # The cluster overview moved into getting_started/. Keep the old URL
        # working for bookmarks and links shared before the move.
        general/overview.md: getting_started/overview.md
  - macros
  - include-markdown
  - table-reader
  - caption:
      table:
        enable: true
        caption_prefix: ''
        allow_indented_caption: false
        position: top
      figure:
        ignore_classes: ["left"]

extra_css:
  - assets/stylesheets/neoteroi-mkdocs.css
  - assets/stylesheets/extra.css

extra_javascript:
    - assets/javascripts/general.js

markdown_extensions: 
  - abbr
  - attr_list
  - admonition
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  #- pydownx.highlight
  - pymdownx.caret
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - neoteroi.cards

extra:
  support_email: '<a href="mailto:rtis.support@otago.ac.nz">rtis.support@otago.ac.nz</a>'
  home_quota: "40 GB"
  # Triage form for support requests. The form does not exist yet — until it does, the
  # button and the table row that use this are wrapped in a Jinja {# ... #} comment in
  # general/support.md. Set the real URL here and uncomment there to publish it.
  support_form: "https://forms.cloud.microsoft/r/PLACEHOLDER"
