name: ci 
on:
  push:
    branches:
      - master 
      - main
  # Build (without deploying) on PRs, so a broken build or a bad internal
  # link is caught while the PR is open rather than after it reaches main.
  pull_request:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt 
      # On a PR, only check that the site builds. Deployment happens on push
      # to main, so gh-deploy must not run from a pull_request event.
      - run: mkdocs build --strict
        if: github.event_name == 'pull_request'
      - run: mkdocs gh-deploy --force
        if: github.event_name == 'push'
